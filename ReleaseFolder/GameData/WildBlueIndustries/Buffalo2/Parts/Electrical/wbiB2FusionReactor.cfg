PART:NEEDS[Blueshift]
{
	name = wbiB2FusionReactor
	module = Part
	author = Angel-125

	MODEL
	{
		model = WildBlueIndustries/Buffalo2/Parts/sharedAssets/b2FusionReactor
	}
	MODEL
	{
		model = WildBlueIndustries/Blueshift/Parts/Engine/WarpTech/b2FusionTorus
	}
	rescaleFactor = 1

	node_attach = 0, 0, 0.66292, 0, 0, -1, 1
	node_stack_top = 0, 0.15625, 0, 0, 1, 0, 2
	node_stack_bottom = 0, -0.15625, 0, 0, -1, 0, 2
	node_stack_back = 0, 0, 0.66292, 0, 0, 1, 1
	node_stack_front = 0, 0, -0.66292, 0, 0, -1, 1

	TechRequired = wbiGravityWaveApplications
	entryCost = 50000
	cost = 75000
	category = Electrical
	subcategory = 0
	title = #LOC_BUFFALO_fusionReactorTitle // B2 Fusion Reactor
	manufacturer = Wild Blue Industries
	description = #LOC_BUFFALO_FusionReactorDesc // This magneto hydrodynamic fusion reactor consumes fusion pellets to produce electric charge. 

	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,1,1,1

	// --- standard part parameters ---
	mass = 0.45
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 20
	maxTemp = 1000
	maxSkinTemp = 2000
	breakingForce = 50000
	breakingTorque = 50000
	bulkheadProfiles = size1p5, srf
	CrewCapacity = 0
	tags = cck-rovers cargo storage

	MODULE
	{
		name = WBIAnimatedTexture

		// ID of the module so we can distinguish between several animated textures in one part.
		// This one is controlled by the warp coil.
		moduleID = FusionTorus

		textureTransformName = fusionTorus
		animatedEmissiveTexture = WildBlueIndustries/Blueshift/Parts/Engine/WarpTech/WarpPlasma
		minFramesPerSecond = 50
		maxFramesPerSecond = 50
		emissiveFadeTime = 0.5
	}

	// Generators are just like the stock resource converter, except that this one can control animated textures and/or Effects.
	// This generator produces the GravityWaves that power warp coils by consuming Graviolium and FusionPellets.
	MODULE
	{
		name = WBIModuleGeneratorFX

		// This also replaces the name shown in the editor.
		ConverterName = Fusion Power

		// Short description of the module as displayed in the editor.
		moduleDescription = Provides large amounts of power.

		StartActionName = Activate Fusion Power
		StopActionName = Deactivate Fusion Power
		ToggleActionName = Toggle Fusion Power

		// Generators can control animated textures
		// Hint: You can control multiple animated textures in the same part if they share the same moduleID.
		textureModuleID = FusionTorus

		// Generators can control effects too
//		startEffect = effectStart
//		stopEffect = effectStop
		runningEffect = running

		INPUT_RESOURCE
		{
			ResourceName = FusionPellets
			Ratio = 0.001176
			FlowMode = STAGE_PRIORITY_FLOW
		}

		OUTPUT_RESOURCE
		{
			ResourceName = wbiElectroPlasma
			Ratio = 1200
			DumpExcess = true
			FlowMode = ALL_VESSEL
		}

		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 600
			DumpExcess = false
			FlowMode = ALL_VESSEL
		}

		REQUIRED_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 120
		}	

		DRAINED_RESOURCE
		{
			ResourceName = wbiElectroPlasma
			Ratio = 120
		}
	}

	MODULE
	{
		name = ModulePartVariants
		baseVariant = Rover
		baseMass = 0.125
		baseCost = 0
		useProceduralDragCubes = true

		VARIANT
		{
			name = Rover
			mass = 0.125
			cost = 0
			displayName =  #LOC_BUFFALO_variantRover // Rover
			primaryColor = #3a562a
			secondaryColor = #999999
			sizeGroup = GroupB
			GAMEOBJECTS
			{
				station = false
				superstructure = false
			}
			TEXTURE
			{
				materialName = Buffalo1
				_MainTex = WildBlueIndustries/Buffalo2/Parts/sharedAssets/Buffalo1
				_BumpMap = WildBlueIndustries/Buffalo2/Parts/sharedAssets/Buffalo1Nrm
			}
		}
		VARIANT
		{
			name = Station
			mass = 0.145
			cost = 0
			displayName =  #LOC_BUFFALO_variantStation // Station
			primaryColor = #3a562a
			secondaryColor = #999999
			sizeGroup = GroupB
			GAMEOBJECTS
			{
				station = true
				superstructure = false
			}
			TEXTURE
			{
				materialName = Buffalo1
				_MainTex = WildBlueIndustries/Buffalo2/Parts/sharedAssets/Buffalo1
				_BumpMap = WildBlueIndustries/Buffalo2/Parts/sharedAssets/Buffalo1StationNrm
			}
		}
		VARIANT
		{
			name = Superstructure
			mass = 0.125
			cost = 0
			displayName =  #LOC_BUFFALO_variantSuperstructure // Superstructure
			primaryColor = #3a562a
			secondaryColor = #999999
			sizeGroup = GroupB
			GAMEOBJECTS
			{
				station = false
				superstructure = true
			}
			TEXTURE
			{
				materialName = Buffalo1
				_MainTex = WildBlueIndustries/Buffalo2/Parts/sharedAssets/Buffalo1
				_BumpMap = WildBlueIndustries/Buffalo2/Parts/sharedAssets/Buffalo1Nrm
			}
		}

		VARIANT
		{
			name = SuperstructureGray
			mass = 0.125
			cost = 0
			displayName =  #LOC_BUFFALO_variantSuperstructureGray // Superstructure (Gray)
			primaryColor = #3a562a
			secondaryColor = #999999
			sizeGroup = GroupB
			GAMEOBJECTS
			{
				station = false
				superstructure = true
			}
			TEXTURE
			{
				materialName = Buffalo1
				_MainTex = WildBlueIndustries/Buffalo2/Parts/sharedAssets/Buffalo1Gray
				_BumpMap = WildBlueIndustries/Buffalo2/Parts/sharedAssets/Buffalo1Nrm
			}
		}
	}

	MODULE
	{
		name = ModuleCargoPart		
		InventorySlots = 6
		packedVolume = 700
	}

	RESOURCE
	{
		name = FusionPellets
		amount = 75
		maxAmount = 75
	}

	RESOURCE
	{
		name = ElectricCharge
		amount = 130
		maxAmount = 130
	}

	RESOURCE
	{
		name = wbiElectroPlasma
		amount = 0
		maxAmount = 1200
		isTweakable = false
	}

	EFFECTS
	{	
		running
		{
			AUDIO
			{
				channel = Ship
				clip = WildBlueIndustries/Blueshift/FX/FusionReactorRunning
				volume = 0.0 0.0
				volume = 0.05 0.5
				volume = 1.0 0.5
				pitch = 0.0 0.0
				pitch = 0.05 0.5
				pitch = 1.0 0.6
				loop = true
			}
		}
	}
}
