PART:NEEDS[WildBlueCore]
{
	name = wbiBISC
	module = Part
	author = Angel-125

	MODEL
	{
		model = WildBlueIndustries/Buffalo2/Parts/sharedAssets/bisc
	}
	MODEL
	{
		model = WildBlueIndustries/Buffalo2/Parts/Structural/chassis/biscDockingPorts
	}
	MODEL
	{
		model = WildBlueIndustries/Buffalo2/Parts/Utility/supportUnit/biscGripperPads
	}
	rescaleFactor = 1

	node_attach = 0, 0, -0.66292, 0, 0, -1, 1
	node_stack_top = 0, 2.913, 0, 0, 1, 0, 2
	node_stack_bottom = 0, -2.913, 0, 0, -1, 0, 2
	node_stack_front = 0, 0, -0.719, 0, 0, -1, 1
	node_stack_back = 0, 0, 0.719, 0, 0, 1, 1

	TechRequired = advExploration
	entryCost = 4400
	cost = 1200
	category = Cargo
	subcategory = 0
	title = #LOC_BUFFALO_biscTitle // Buffalo Intermodal Shipping Container
	manufacturer = Wild Blue Industries
	description = #LOC_BUFFALO_biscDesc // The Buffalo Intermodal Shipping Container (BISC), a.k.a. "Biscuit," is a cargo container built around the Buffalo Logistics Intermodal Shipping Standard (BLISS). Based on the Buffalo Cargo Unit (BCU)- a measurement standard equal to 1,000 liters of cargo volume- BLISS standardizes the shipment of 6 BCUs per container. From truck to shuttle, space station to offworld base, the BISC provides a standardized way to package and transport goods across a wide variety of vehicles, services, and environments.

	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,1,1,1

	// --- standard part parameters ---
	mass = 1.5
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 20
	maxTemp = 1000
	maxSkinTemp = 2000
	breakingForce = 50000
	breakingTorque = 50000
	bulkheadProfiles = size1p5, srf
	CrewCapacity = 0
	tags = cck-rovers cargo storage

	MODULE
	{
		name = ModuleInventoryPart		
		InventorySlots = 24
		packedVolumeLimit = 6000
	}

	MODULE
	{
		name = WBIModuleDockingNode
		displayName = #LOC_BUFFALO_biscFront // Front
		nodeTransformName = frontDockingNode
		referenceAttachNode = top
		nodeType = b2RoverBody
		stagingEnabled = True
		minDistanceToReEngage = 1
		captureMinRollDot = 0.99996192
		snapRotation = true
		snapOffset = 30
	}

	MODULE
	{
		name = WBIModuleDockingNode
		displayName = #LOC_BUFFALO_biscBack // Back
		nodeTransformName = backDockingNode
		referenceAttachNode = bottom
		nodeType = b2RoverBody
		stagingEnabled = True
		minDistanceToReEngage = 1
		captureMinRollDot = 0.99996192
		snapRotation = true
		snapOffset = 30
	}

	MODULE
	{
		name = WBIModuleDockingNode
		displayName = #LOC_BUFFALO_biscTop // Top
		nodeTransformName = topDockingNode
		referenceAttachNode = front
		nodeType = b2RoverBody
		stagingEnabled = True
		minDistanceToReEngage = 1
		captureMinRollDot = 0.99996192
		snapRotation = true
		snapOffset = 30
	}

	MODULE
	{
		name = WBIModuleDockingNode
		displayName = #LOC_BUFFALO_biscBottom // Bottom
		nodeTransformName = bottomDockingNode
		referenceAttachNode = back
		nodeType = b2RoverBody
		stagingEnabled = True
		minDistanceToReEngage = 1
		captureMinRollDot = 0.99996192
		snapRotation = true
		snapOffset = 30
	}

	MODULE
	{
		name = WBIModuleDockingNodeController 
	}

	MODULE
	{
		name = WBIModuleDecal
		decalTransforms = decal001
		isVisible = true
		allowFieldEdit = true
		toggleDecalName = #LOC_BUFFALO_toggleDecal1 // Toggle Logo: Mid
		selectDecalName = #LOC_BUFFALO_changeDecal1 // Change Logo: Mid
	}

	MODULE
	{
		name = WBIModuleDecal
		decalTransforms = decal002
		isVisible = false
		allowFieldEdit = true
		toggleDecalName = #LOC_BUFFALO_toggleDecal2 // Toggle Logo: Front
		selectDecalName = #LOC_BUFFALO_changeDecal2 // Change Logo: Front
	}

	MODULE
	{
		name = WBIModuleDecal
		decalTransforms = decal003
		isVisible = false
		allowFieldEdit = true
		toggleDecalName = #LOC_BUFFALO_toggleDecal3 // Toggle Logo: Back
		selectDecalName = #LOC_BUFFALO_changeDecal3 // Change Logo: Back
	}

	MODULE
	{
		name = ModulePhysicMaterial
		activePhysicMaterialName = ExtremeGrip
		PhysicMaterialName = ExtremeGrip
	}
}
